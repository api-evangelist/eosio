openapi: 3.1.0
info:
  title: EOSIO / Antelope Nodeos Chain Get Abi API
  description: HTTP/JSON RPC interface exposed by the chain_api_plugin in nodeos, the reference EOSIO (now Antelope) blockchain node implementation. The chain API allows clients to read blockchain state, fetch blocks and accounts, inspect ABI and contract data, and submit signed transactions to the network.
  version: '1.0'
  contact:
    name: EOS Network Foundation
    url: https://eosnetwork.com/
  license:
    name: MIT
    url: https://github.com/AntelopeIO/leap/blob/main/LICENSE
servers:
- url: '{node}/v1/chain'
  description: Nodeos HTTP RPC endpoint with chain_api_plugin enabled.
  variables:
    node:
      default: https://eos.greymass.com
      description: Base URL of an EOS/Antelope node.
tags:
- name: Get Abi
paths:
  /get_abi:
    post:
      summary: Get the ABI for a contract account
      description: Returns the application binary interface (ABI) currently set for the given account, used to encode and decode actions and table rows.
      operationId: getAbi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_name:
                  type: string
                  example: eosio.token
              required:
              - account_name
      responses:
        '200':
          description: ABI for the account.
          content:
            application/json:
              schema:
                type: object
      tags:
      - Get Abi
